<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050912">
  <meta name="description" content="杨若璇。">
  <meta property="og:title" content="杨若璇">
  <meta property="og:description" content="杨若璇的留言簿">
  <meta property="og:type" content="website">
  <title>杨若璇</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/space.css">
  <script src="/marquee.js" defer></script>
  <script src="/guestbook.js" defer></script>
  <script src="/constellation.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#messages">跳到留言</a>
  <div class="space-backdrop" aria-hidden="true"><div class="nebula-haze"></div><canvas id="constellation-canvas"></canvas></div>
  <div class="page-grain" aria-hidden="true"></div>
  <header class="site-header site-shell">
    <a class="wordmark" href="#page-title" aria-label="杨若璇首页">RUOXUAN<span>·</span></a>
    <nav aria-label="主导航">
      <a class="nav-link" href="#messages">读</a><a class="nav-link" href="#compose">写</a>
      <button class="motion-toggle icon-button" type="button" aria-label="暂停动效" aria-pressed="false" title="暂停动效"><span aria-hidden="true">Ⅱ</span></button>
      <button class="theme-toggle icon-button" type="button" aria-label="切换到蓝调星空" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.1A8.3 8.3 0 0 1 9.9 4 8.4 8.4 0 1 0 20 14.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
    </nav>
  </header>
  <main>
    <section class="name-stage" aria-labelledby="page-title">
      <div class="stage-grid" aria-hidden="true"></div>
      <div class="marquee-field" aria-hidden="true"></div>
      <div class="name-center"><p class="name-roman" aria-hidden="true">YANG RUOXUAN</p><h1 id="page-title">杨若璇<span class="name-period" aria-hidden="true">.</span></h1></div>
      <a class="stage-down" href="#messages" aria-label="往下读留言"><svg width="20" height="26" viewBox="0 0 20 26" aria-hidden="true"><path d="M10 2v20M4 16l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
    </section>
    <section class="guestbook-grid site-shell" aria-label="留言簿">
      <div class="messages-column" id="messages">
        <div class="section-heading"><h2>留言<span class="message-count" aria-label="留言总数">—</span></h2><button class="refresh-button" type="button" aria-label="刷新留言"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1l2.4 3M4 15l2.4 3A7 7 0 0 0 18 17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        <span class="list-status sr-only" role="status">加载中</span>
        <div class="list-notice" id="list-notice" role="status" hidden></div>
        <div class="message-list" id="message-list" aria-live="polite" aria-busy="true"><div class="loading-card"><span class="loading-dot"></span>加载中</div></div>
        <button class="load-more" type="button" hidden>更多 <span aria-hidden="true">↓</span></button>
      </div>
      <aside class="compose-column" id="compose" aria-labelledby="compose-title">
        <div class="compose-card"><h2 id="compose-title">写</h2>
          <form id="message-form" novalidate>
            <div class="field"><label for="nickname">昵称</label><input id="nickname" name="nickname" type="text" maxlength="48" autocomplete="nickname" placeholder="你的名字" required aria-describedby="nickname-error"><p class="field-error" id="nickname-error" hidden></p></div>
            <div class="field"><label for="message">留言</label><textarea id="message" name="message" rows="5" maxlength="1000" placeholder="…" required aria-describedby="message-error character-count"></textarea><div class="textarea-footer"><span id="character-count">0 / 500</span></div><p class="field-error" id="message-error" hidden></p></div>
            <div class="honey-field" aria-hidden="true"><label for="website">请保持此项为空</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
            <p class="form-status" id="form-status" role="status" hidden></p>
            <button class="submit-button" type="submit"><span class="submit-label">留下</span><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <p class="public-note">公开留言 · 无需注册</p>
          </form>
        </div>
      </aside>
    </section>
  </main>
  <footer class="site-footer site-shell"><span>杨若璇</span><a href="#page-title" class="back-top" aria-label="回到顶部">↑</a></footer>
  <div class="toast" role="status" hidden><span aria-hidden="true">✓</span><span>已留下。</span></div>
  <noscript><p class="noscript-note">开启 JavaScript 后可读写留言。</p></noscript>
</body>
</html>
