<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>图片小游戏合集</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e8eaed; --muted: #9aa0ac; --accent: #6ea8fe;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2030 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  header { text-align: center; margin-bottom: 22px; }
  h1 { margin: 0 0 6px; font-size: clamp(22px, 5.5vw, 32px); letter-spacing: 1px; }
  .lead { color: var(--muted); font-size: 13px; max-width: 420px; margin: 0 auto; }
  .photo-strip {
    margin-top: 14px;
    width: min(94vw, 360px); aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: url("images/1st.png") center/cover;
    box-shadow: 0 18px 48px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .photo-strip::after {
    content: "本合集全部游戏使用这张照片";
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    color: #fff; font-size: 12px; text-align: center;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    width: min(94vw, 880px);
    margin-top: 8px;
  }
  .card {
    text-decoration: none; color: inherit;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    min-height: 140px;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: var(--grad); opacity: .35;
    transition: opacity .2s;
    pointer-events: none;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  .card:hover::before { opacity: .55; }
  .card:active { transform: translateY(-1px); }
  .icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--grad); display: flex; align-items: center; justify-content: center;
    font-size: 24px; box-shadow: 0 6px 14px rgba(0,0,0,.3);
    position: relative; z-index: 1;
  }
  .name { font-size: 17px; font-weight: 600; position: relative; z-index: 1; }
  .desc { font-size: 12.5px; color: var(--muted); position: relative; z-index: 1; line-height: 1.5; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 1; margin-top: auto; }
  .tag {
    font-size: 11px; color: var(--muted);
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px;
  }

  .footer {
    margin-top: 26px; color: var(--muted); font-size: 12px; text-align: center;
  }

  @media (max-width: 380px) {
    .cards { grid-template-columns: 1fr; }
    .card { min-height: 120px; }
  }
</style>
</head>
<body>
  <header>
    <h1>图片小游戏合集</h1>
    <p class="lead">同一张照片,四种玩法。挑一个开始吧。</p>
    <div class="photo-strip" aria-hidden="true"></div>
  </header>

  <div class="cards">
    <a class="card" href="app.html?game=puzzle" style="--grad: linear-gradient(135deg, #4a6cf7, #6ea8fe)">
      <div class="icon">⊞</div>
      <div class="name">滑块拼图</div>
      <div class="desc">把照片切成 4×4,带数字提示,滑动方块按 1→15 顺序归位。完成后揭示完整照片。</div>
      <div class="tags"><span class="tag">数字提示</span><span class="tag">轻微虚化</span><span class="tag">3 档难度</span></div>
    </a>

    <a class="card" href="app.html?game=memory" style="--grad: linear-gradient(135deg, #b06bb3, #d68ad1)">
      <div class="icon">⇄</div>
      <div class="name">翻牌配对</div>
      <div class="desc">背面朝下的图块,每次翻开两张,记住位置把相同图块全部配对。考验记忆力。</div>
      <div class="tags"><span class="tag">3D 翻转</span><span class="tag">6/8 对</span></div>
    </a>

    <a class="card" href="app.html?game=jigsaw" style="--grad: linear-gradient(135deg, #2f9e6e, #5ec98f)">
      <div class="icon">⊟</div>
      <div class="name">拼图复原</div>
      <div class="desc">照片切成 3×3 或 4×4 块并打乱,点击两块交换位置,把图复原即可。无数字,纯靠图像。</div>
      <div class="tags"><span class="tag">无虚化</span><span class="tag">点选交换</span></div>
    </a>

    <a class="card" href="app.html?game=spotdiff" style="--grad: linear-gradient(135deg, #d9924a, #f0b66a)">
      <div class="icon">◎</div>
      <div class="name">找不同</div>
      <div class="desc">并排显示两张照片,右图有若干被悄悄改动的区域,点击把它们找出来。</div>
      <div class="tags"><span class="tag">限时观察</span><span class="tag">3/5/7 处</span></div>
    </a>
  </div>

  <div class="footer">
    手机、电脑均可访问 · 单文件部署,无需服务器配置
  </div>
</body>
</html>
