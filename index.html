<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>⚠️ 警告 · 访问受限</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: 'Courier New', Courier, monospace, sans-serif;
  }
  canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
  }
  .container {
    position: relative; z-index: 10; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
    background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.92) 90%);
  }
  .warning-badge {
    display: inline-block; padding: 6px 18px; border-radius: 20px;
    background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.6);
    color: #f87171; font-size: 14px; font-weight: bold; letter-spacing: 3px;
    margin-bottom: 20px; text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    animation: pulse 1.5s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.05); opacity: 1; }
  }
  .main-title {
    font-size: clamp(20px, 4.5vw, 40px); font-weight: 900; color: #fff;
    line-height: 1.4; text-shadow: 0 0 20px rgba(56, 189, 248, 0.8), 0 0 40px rgba(168, 85, 247, 0.6);
    min-height: 110px; display: flex; align-items: center; justify-content: center;
    max-width: 900px; word-break: break-all; margin-bottom: 15px;
  }
  .glitch-text {
    color: #38bdf8; position: relative; display: inline-block;
  }
  .glitch-text::before, .glitch-text::after {
    content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .glitch-text::before {
    left: 2px; text-shadow: -2px 0 #ff00c1; clip: rect(24px, 550px, 90px, 0);
    animation: glitch-anim 3s infinite linear alternate-reverse;
  }
  .glitch-text::after {
    left: -2px; text-shadow: -2px 0 #00fff9, 0 2px #ff00c1; clip: rect(85px, 550px, 140px, 0);
    animation: glitch-anim2 2.5s infinite linear alternate-reverse;
  }
  @keyframes glitch-anim {
    0% { clip: rect(12px, 9999px, 44px, 0); transform: skew(0.3deg); }
    50% { clip: rect(68px, 9999px, 12px, 0); transform: skew(0.8deg); }
    100% { clip: rect(33px, 9999px, 89px, 0); transform: skew(0.1deg); }
  }
  @keyframes glitch-anim2 {
    0% { clip: rect(54px, 9999px, 10px, 0); transform: skew(0.5deg); }
    50% { clip: rect(2px, 9999px, 78px, 0); transform: skew(0.2deg); }
    100% { clip: rect(91px, 9999px, 45px, 0); transform: skew(0.7deg); }
  }
  .gibberish-box {
    margin-bottom: 25px; padding: 12px 20px; border-radius: 12px;
    background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(56, 189, 248, 0.3);
    color: #a855f7; font-size: clamp(12px, 2.2vw, 15px); letter-spacing: 3px;
    box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
    max-width: 600px; word-break: break-all;
  }
  
  /* 炫酷变猪控制面板 */
  .action-panel {
    display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 480px;
  }
  .transform-btn {
    position: relative; padding: 14px 32px; font-size: 16px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); border: none; border-radius: 50px;
    cursor: pointer; box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
    transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 2px;
    outline: none; overflow: hidden;
  }
  .transform-btn:hover {
    transform: scale(1.05); box-shadow: 0 0 35px rgba(236, 72, 153, 0.9);
  }
  .transform-btn:active {
    transform: scale(0.96);
  }
  .transform-btn:disabled {
    opacity: 0.6; cursor: not-allowed; transform: none;
  }
  
  /* 进度条容器 */
  .progress-container {
    width: 100%; background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(236, 72, 153, 0.4);
    border-radius: 12px; padding: 12px 16px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    display: none; flex-direction: column; gap: 8px;
  }
  .progress-container.active {
    display: flex;
  }
  .progress-info {
    display: flex; justify-content: space-between; font-size: 13px; color: #f472b6; font-weight: bold;
  }
  .progress-bar-bg {
    width: 100%; height: 14px; background: #0f172a; border-radius: 7px; overflow: hidden; position: relative;
  }
  .progress-bar-fill {
    width: 0%; height: 100%; background: linear-gradient(90deg, #ec4899, #f43f5e, #fbbf24);
    border-radius: 7px; transition: width 0.2s ease-out;
    box-shadow: 0 0 10px rgba(236, 72, 153, 0.8);
  }
  .result-banner {
    margin-top: 10px; font-size: 18px; font-weight: 900; color: #4ade80;
    text-shadow: 0 0 15px rgba(74, 222, 128, 0.8); display: none;
  }
  .footer-hint {
    margin-top: 25px; color: #64748b; font-size: 12px; letter-spacing: 2px;
  }

  /* 屏幕震动特效类 */
  .shake-screen {
    animation: screenShake 0.4s infinite;
  }
  @keyframes screenShake {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-3px, 3px) rotate(-0.5deg); }
    40% { transform: translate(3px, -2px) rotate(0.5deg); }
    60% { transform: translate(-2px, -3px) rotate(-0.3deg); }
    80% { transform: translate(2px, 2px) rotate(0.3deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* 浮动警告提示 */
  .floating-popup {
    position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
    background: rgba(239, 68, 68, 0.9); border: 2px solid #fff; color: #fff;
    padding: 10px 24px; border-radius: 8px; font-weight: bold; font-size: 15px;
    z-index: 1000; box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    pointer-events: none; animation: popIn 0.3s ease-out forwards;
  }
  @keyframes popIn {
    0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; }
    100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
  }
</style>
</head>
<body id="body">
  <canvas id="matrix"></canvas>
  <div class="container">
    <div class="warning-badge">🔒 SYSTEM ACCESS RESTRICTED</div>
    <div class="main-title">
      <span id="multilingual-text" class="glitch-text" data-text="">加载中...</span>
    </div>
    <div class="gibberish-box" id="gibberish">
      #￥%%￥…………%%……￥%￥#￥￥# 阿巴阿巴 System Error 404... 🤪
    </div>

    <!-- 变猪控制面板 -->
    <div class="action-panel">
      <button id="transform-btn" class="transform-btn" onclick="startTransform()">✨ 一键启动：把杨若璇变成猪 🐷</button>
      
      <div id="progress-box" class="progress-container">
        <div class="progress-info">
          <span id="progress-status">正在连接杨若璇的脑电波...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div id="result-banner" class="result-banner">🎉 转换成功：巨型可爱小猪若璇已上线！oink ~ 🐽</div>
    </div>

    <div class="footer-hint">
      杨若璇专属安全防火墙 · 严禁未授权开发
    </div>
  </div>

  <script>
    // 矩阵数字雨背景特效（动态融入猪猪表情）
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let matrixColor = '#00ffcc';
    let baseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@$%&*杨若璇阿巴阿巴';
    let chars = baseChars;
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = matrixColor;
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    // 多语言循环播放列表
    const messages = [
      "这个是杨若璇的个人网站，但是她不让我开发",
      "This is Yang Ruoxuan's personal website, but she won't let me develop it.",
      "ここは楊若璇の個人ウェブサイトですが、彼女は開発させてくれません。",
      "이것은 양뤄쉬안의 개인 웹사이트이지만, 그녀는 개발을 허락하지 않습니다.",
      "C'est le site web personnel de Yang Ruoxuan, mais elle ne me laisse pas le développer.",
      "Dies ist die persönliche Website von Yang Ruoxuan, aber sie lässt mich nicht entwickeln.",
      "Este es el sitio web personal de Yang Ruoxuan, ¡pero no me deja desarrollar!",
      "Это личный сайт Ян Росюань, но она не разрешает мне его разрабатывать.",
      "⚠️ 警告：杨若璇独占域名，开发请求已被拒绝！阿巴阿巴 #￥%%￥……"
    ];

    let msgIndex = 0;
    const textEl = document.getElementById('multilingual-text');

    function updateMessage() {
      const currentText = messages[msgIndex];
      textEl.textContent = currentText;
      textEl.setAttribute('data-text', currentText);
      msgIndex = (msgIndex + 1) % messages.length;
    }

    updateMessage();
    setInterval(updateMessage, 4000);

    // 炫酷乱码动态生成器
    const gibberishBox = document.getElementById('gibberish');
    const symbols = ['#￥%%￥…………', '阿巴阿巴🤪', 'ERROR_404_YANG', '~#@$%^&*()_+', '🚧 施工中 (被阻止)', '🤪 ￥%￥#￥￥#', 'SYSTEM_PIG_MODE_READY'];

    function updateGibberish() {
      let randomStr = '';
      for (let i = 0; i < 3; i++) {
        randomStr += symbols[Math.floor(Math.random() * symbols.length)] + ' ';
      }
      gibberishBox.textContent = randomStr;
    }
    setInterval(updateGibberish, 1200);

    // 超细化 20 个转化阶段文案
    const stages = [
      { at: 3, text: "正在建立与杨若璇脑电波的秘密连接..." },
      { at: 8, text: "检测到极强傲娇防御网，正在扫描弱点..." },
      { at: 15, text: "正在绕过安全防火墙，尝试注入快乐因子..." },
      { at: 22, text: "正在解析生物 DNA 序列，锁定核心基因..." },
      { at: 30, text: "⚠️ 警告：宿主正在疯狂反抗，启动强力压制！" },
      { at: 38, text: "正在悄悄剥离人类理智，切换萌系频道..." },
      { at: 45, text: "开始大量注入粉红色猪猪基因代码..." },
      { at: 52, text: "正在重写饮食偏好：由沙拉切换为疯狂干饭..." },
      { at: 60, text: "正在调整圆滚滚的身材比例与面部萌化度..." },
      { at: 68, text: "正在加装哼哧哼哧音效模块与立体大耳朵..." },
      { at: 75, text: "正在生成萌力十足且会摇晃的卷曲小尾巴..." },
      { at: 82, text: "正在清空高冷记忆，灌输‘今天吃什么’灵魂拷问..." },
      { at: 90, text: "最终校验：贪吃属性与可爱暴击已同步 100%！" },
      { at: 98, text: "倒计时：小猪若璇即将破壳而出..." },
      { at: 100, text: "转换 100% 完成！" }
    ];

    function showPopup(msg) {
      const pop = document.createElement('div');
      pop.className = 'floating-popup';
      pop.textContent = msg;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1600);
    }

    function startTransform() {
      const btn = document.getElementById('transform-btn');
      const progressBox = document.getElementById('progress-box');
      const progressFill = document.getElementById('progress-fill');
      const progressStatus = document.getElementById('progress-status');
      const progressPercent = document.getElementById('progress-percent');
      const resultBanner = document.getElementById('result-banner');
      const bodyEl = document.getElementById('body');

      btn.disabled = true;
      progressBox.classList.add('active');
      resultBanner.style.display = 'none';
      matrixColor = '#ec4899';
      chars = baseChars + '🐷🐽🐷🐽🤪🔥💥';

      let progress = 0;
      const interval = setInterval(() => {
        progress += 1; // 匀速细化推进
        if (progress > 100) progress = 100;

        progressFill.style.width = progress + "%";
        progressPercent.textContent = progress + "%";

        // 匹配对应阶段文案
        const matched = stages.filter(s => progress >= s.at);
        if (matched.length > 0) {
          progressStatus.textContent = matched[matched.length - 1].text;
        }

        // 关键节点触发浮动警告与震动
        if (progress === 30) {
          showPopup("🔥 触发防御机制：傲娇护盾开启！");
          bodyEl.classList.add('shake-screen');
          setTimeout(() => bodyEl.classList.remove('shake-screen'), 800);
        }
        if (progress === 65) {
          showPopup("⚡ 基因重组中：圆润化处理加速！");
        }
        if (progress === 88) {
          showPopup("💥 最终冲刺：小尾巴正在长出来！");
          bodyEl.classList.add('shake-screen');
          setTimeout(() => bodyEl.classList.remove('shake-screen'), 1000);
        }

        if (progress === 100) {
          clearInterval(interval);
          resultBanner.style.display = "block";
          matrixColor = '#4ade80';
          chars = baseChars + '🐷🐽✨🎉💖';
          btn.disabled = false;
          btn.textContent = "🔄 再次逆转 (重置)";
        }
      }, 150); // 整体过程约 15 秒，极具仪式感
    }
  </script>
</body>
</html>
